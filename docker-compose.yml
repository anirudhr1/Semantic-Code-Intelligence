version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semantic-code-intelligence-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist index and repos between container restarts
      - ./data/index:/app/data/index
      - ./data/repos:/app/data/repos
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
